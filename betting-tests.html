<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betting Tests | Ben's World Cup</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f3ead7;
      color: #1f2430;
      font-family: "Courier New", Courier, monospace;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
    }

    .test-summary,
    .test-result {
      margin-bottom: 12px;
      padding: 12px;
      border: 3px solid #000000;
      background: #ffffff;
      font-weight: 700;
    }

    .pass {
      background: #d7f5c8;
    }

    .fail {
      background: #ffd1d1;
    }
  </style>
</head>
<body>
  <!--
    This betting test page was created by AI to help Ben check the betting code
    before deploying. It is separate from the real website pages and is only for testing.
  -->
  <main>
    <h1>Betting Tests</h1>

    <p class="test-summary" id="test-summary">
      Running betting tests...
    </p>

    <section id="test-results" aria-label="Betting test results"></section>
  </main>

  <!-- This module runs the betting tests and prints PASS or FAIL results above. -->
  <script type="module" src="betting-tests.js"></script>
</body>
</html>
